[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-triage-agent"
version = "0.1.0"
description = "Turns scanner output into a grounded pentest report, and measures LLM hallucination"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Venkatesh Yalam" }]
keywords = ["security", "llm", "hallucination", "pentest", "cvss", "agent"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
openai = ["openai>=1.0"]

[project.scripts]
vulntriage = "triage.cli:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
