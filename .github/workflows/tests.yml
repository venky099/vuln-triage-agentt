name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # LLM_BACKEND is pinned throughout so the runner can never auto-detect its
      # way onto a real model: the whole suite must pass with no key, no network.
      - name: Tests
        env:
          LLM_BACKEND: mock
        run: pytest -q

      # Exit 1 means findings were flagged for review, which is the correct
      # outcome for the bundled sample. Anything above 1 is a real failure.
      - name: CLI end to end
        env:
          LLM_BACKEND: mock
        run: |
          set +e
          for fmt in markdown json html; do
            python -m triage.cli data/sample_scan.json -f "$fmt" -o /dev/null --quiet
            code=$?
            if [ "$code" -gt 1 ]; then
              echo "::error::vulntriage -f $fmt exited $code"
              exit 1
            fi
          done

      - name: Eval harness
        env:
          LLM_BACKEND: mock
        run: python evals/run_eval.py -n 12 --out /tmp/eval.json
